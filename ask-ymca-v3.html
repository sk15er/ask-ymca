<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

@media(min-width:620px){body{background:#E7E3DA;display:grid;place-items:center}#app{height:min(880px,96%)!important;border-radius:38px;box-shadow:0 30px 80px rgba(40,30,10,.18),0 0 0 1px var(--line)}}
#app{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;margin:0 auto}
#stage{flex:1;min-height:0;position:relative}
.scr{display:none;position:absolute;inset:0;flex-direction:column}.scr.on{display:flex}
.in{flex:1;overflow-y:auto;padding:6px 20px 28px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 2px}
.brand{font:italic 22px var(--serif);display:flex;align-items:center;gap:8px}.brand i{width:9px;height:9px;border-radius:50%;background:var(--acc)}

h2{font:400 34px/1.08 var(--serif);margin:6px 0 12px;letter-spacing:-.3px}
.lab{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 8px}

.gd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .15s}.tl:active{transform:scale(.97)}

.b .t{font-size:16px;line-height:1.55}.t.warn{background:var(--soft);padding:12px 14px;border-radius:16px}
.dots{display:flex;gap:5px;padding:8px 0}.dots s{width:7px;height:7px;border-radius:50%;background:var(--acc);opacity:.35;animation:bl 1s infinite}.dots s:nth-child(2){animation-delay:.15s}.dots s:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:1}}

.ac{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;font-size:13px}.ac:active,.row:active,.cu:active{background:var(--sf)}

.uh{display:none;margin-top:8px;font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--sub);background:var(--sf);padding:8px 10px;border-radius:10px}body.dev .uh{display:block}

.go{width:48px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:18px}
#tabs{display:flex;border-top:1px solid var(--line);background:rgba(250,248,244,.94);padding:6px 6px 8px}
.tb{flex:1;border:0;background:none;color:#9A9488;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:4px 0}.tb.on{color:var(--ink);font-weight:600}.tb.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--acc)}.tb:not(.on)::after{content:"";width:4px;height:4px}
.srch{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font:inherit;outline:none;margin-bottom:10px}
.st{background:none;border:0;font-size:20px;color:var(--sub);padding:4px}.st.on{color:var(--acc)}
.nt i{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
#px{position:absolute;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;animation:ps .28s cubic-bezier(.2,.8,.2,1)}#px.on{display:flex}@keyframes ps{from{transform:translateX(24px);opacity:0}}
.ph{display:flex;align-items:center;gap:12px;padding:14px 20px 6px}.ph span{font:italic 22px var(--serif)}
.card2{background:var(--soft);border-radius:18px;padding:14px 16px;margin-top:12px}.card2 em{font-style:normal;font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:.07em}.card2 p{margin:4px 0 0;font-size:15.5px}
.kv{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:11px 0;font-size:14.5px}.kv span{color:var(--sub)}.kv b{font-weight:500;text-align:right}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}.stat small{display:block;color:var(--sub);font-size:11.5px}.stat b{font-weight:600;font-size:13.5px;line-height:1.25;display:block}

.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.kp b{font:400 34px/1 var(--serif);display:block}.kp small{color:var(--sub);font-size:12px}
.bars div{margin:0 0 10px;font-size:13px}.bars i{display:block;height:8px;border-radius:9px;background:var(--acc);margin-top:5px}
.gap{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:11px 0;font-size:14px}
.sh{position:absolute;inset:0;z-index:20;display:none}.sh.on{display:block}.sh .bd{position:absolute;inset:0;background:rgba(22,20,15,.35);animation:fi .2s}
.pn{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:sl .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}
@keyframes sl{from{transform:translateY(100%)}}@keyframes fi{from{opacity:0}}
.gr{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.pn h3{font:400 28px/1.1 var(--serif);margin:0 0 6px}.pn p{color:var(--sub);margin:0 0 14px;font-size:13.5px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14.5px;line-height:1.6}mark{background:#FFE2D9;color:inherit;padding:1px 3px;border-radius:4px}
.btn{width:100%;border:0;background:var(--ink);color:#fff;border-radius:99px;padding:14px;margin-top:12px;font-weight:500}.btn.g{background:var(--sf);color:var(--ink)}
.pn select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font:inherit;margin-bottom:10px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14.5px}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}#toast.s{opacity:1;transform:translate(-50%,0)}
</style></head>
